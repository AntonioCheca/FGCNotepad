security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            entity:
                class: App\Entity\User
                property: username

    firewalls:
        # API login (stateless JWT login endpoint)
        login:
            pattern: ^/api/login_check
            stateless: true
            user_checker: App\Security\ApiUserChecker
            json_login:
                check_path: /api/login_check
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        # Main API firewall
        api:
            pattern: ^/api
            stateless: true
            user_checker: App\Security\ApiUserChecker
            jwt: ~  # normal in prod/dev; overridden in dev environment

        # Dev tools, profiler, assets
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # Web main firewall
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: /auth/login
                check_path: /auth/login
                default_target_path: /dashboard
                enable_csrf: true
            logout:
                path: app_logout
                # target: app_any_route
            access_denied_url: /unauthorized

    access_control:
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/api/admin, roles: ROLE_ADMIN }
        - { path: ^/api/login_check, roles: PUBLIC_ACCESS }
        - { path: ^/api/register, roles: PUBLIC_ACCESS }
        - { path: ^/api/scenarios, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api, roles: ROLE_USER }

# ========================
# Test environment override
# ========================
when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4       # minimal bcrypt cost for fast tests
                time_cost: 3  # minimal argon time
                memory_cost: 10
