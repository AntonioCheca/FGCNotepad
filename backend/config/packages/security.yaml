security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            entity:
                class: App\Entity\User
                property: username

    firewalls:
        # Main API firewall
        api:
            pattern: ^/api
            stateless: false
            provider: app_user_provider
            user_checker: App\Security\ApiUserChecker
            json_login:
                check_path: /api/login
                username_path: username
                password_path: password
                success_handler: App\Security\BrowserLoginSuccessHandler
                failure_handler: App\Security\BrowserLoginFailureHandler
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

        # Dev tools, profiler, assets
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # Web main firewall
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: /auth/login
                check_path: /auth/login
                default_target_path: /dashboard
                enable_csrf: true
            logout:
                path: app_logout
                # target: app_any_route
            access_denied_url: /unauthorized

    access_control:
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/api/admin, roles: ROLE_ADMIN }
        - { path: ^/api/health$, roles: PUBLIC_ACCESS }
        - { path: ^/api/login$, roles: PUBLIC_ACCESS }
        - { path: ^/api/register, roles: PUBLIC_ACCESS }
        - { path: ^/api/shared-review, roles: PUBLIC_ACCESS }
        # Server-side import folder is shared across users, so only operators may read or consume it.
        - { path: ^/api/replay-video-imports, roles: ROLE_ADMIN }
        - { path: ^/api/(replay-|share-links|practice-tasks|study/), roles: [ROLE_QA_TESTER, ROLE_ADMIN] }
        - { path: ^/api/profile/combo-recommendations, roles: [ROLE_QA_TESTER, ROLE_ADMIN] }
        - { path: ^/api/guides, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/scenarios, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/neutral-stats, roles: PUBLIC_ACCESS, methods: [GET] }
        # Anonymous read access for the public search/detail pages. Writes, solving and the full move list stay behind login;
        # anonymous reads are rate limited per IP (AnonymousApiReadRateLimitSubscriber).
        - { path: '^/api/combo-sequences(/requirements/objects|/leafs/list|/\d+|/\d+/resource-ledger)?$', roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: '^/api/okis(/enders|/\d+)?$', roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: '^/api/blockstrings(/\d+)?$', roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: '^/api/(characters|combo-spacings|connection-types|situations|situations/types|moves/search)$', roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: '^/api/moves/[0-9a-fA-F-]{36}$', roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api, roles: ROLE_USER }

# ========================
# Dev-only passwordless login (used by `make mobile-audit`). Never configured in prod.
# Links come from `php bin/console app:dev:login-link`, are signed with APP_SECRET,
# expire after 5 minutes and work once.
# ========================
when@dev:
    security:
        firewalls:
            api:
                login_link:
                    check_route: api_dev_login_check
                    signature_properties: ['id']
                    lifetime: 300
                    max_uses: 1
                    success_handler: App\Security\BrowserLoginSuccessHandler
                    failure_handler: App\Security\BrowserLoginFailureHandler

# ========================
# Test environment override
# ========================
when@test:
    security:
        firewalls:
            api:
                login_link:
                    check_route: api_dev_login_check
                    signature_properties: ['id']
                    lifetime: 300
                    max_uses: 1
                    success_handler: App\Security\BrowserLoginSuccessHandler
                    failure_handler: App\Security\BrowserLoginFailureHandler
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4       # minimal bcrypt cost for fast tests
                time_cost: 3  # minimal argon time
                memory_cost: 10
