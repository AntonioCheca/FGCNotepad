parameters:
    app.combo_resource.drive_bar_value: 200.0
    app.combo_resource.super_bar_value: 500.0

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Entity/'
            - '../src/Kernel.php'
    App\Controller\:
        resource: '../src/Controller'
        tags: ['controller.service_arguments']
        autowire: true
        autoconfigure: true

    App\Command\DownloadFrameDataFromFatJsonCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'
    App\Command\ImportFrameDataFromFatJsonCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $scalingNormalizer: '@App\Service\FrameDataScalingNormalizerService'
    App\Command\ImportSupercomboCombosCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'
    App\Command\ImportNewChallengerCombosCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'
    App\Service\ComboValueEstimator:
        arguments:
            $driveBarValue: '%app.combo_resource.drive_bar_value%'
            $superBarValue: '%app.combo_resource.super_bar_value%'
    App\Service\ScenarioLayerSolveService:
        arguments:
            $cachePool: '@cache.app'
    App\Serializer\Normalizer\:
        resource: '../src/Serializer/Normalizer'
        tags:
            - { name: serializer.normalizer, priority: 100 }
    App\Serializer\Normalizer\ComboMetricsNormalizer:
        arguments:
            $comboValueEstimator: '@App\Service\ComboValueEstimator'
        tags:
            - { name: serializer.normalizer, priority: 100 }
    App\Serializer\Denormalizer\:
        resource: '../src/Serializer/Denormalizer'
        tags:
            - { name: serializer.denormalizer, priority: 100 }


